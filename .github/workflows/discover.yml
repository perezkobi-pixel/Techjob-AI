# Finds which job-board system each candidate company uses (tools/discover-candidates.json)
# and saves the results to tools/discover-report.json.
name: Discover job sources

on:
  push:
    branches: [main]
    paths: ['tools/discover-candidates.json', 'tools/discover.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/discover.js
      - name: Save the report
        run: |
          git config user.name "techjob-bot"
          git config user.email "techjob-bot@users.noreply.github.com"
          git add tools/discover-report.json
          git diff --cached --quiet || git commit -m "Discovery report $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main && git push || echo "nothing to push"

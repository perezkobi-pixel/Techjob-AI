# Collects jobs every morning and publishes the site to GitHub Pages.
# Also runs when you push to main, and manually from the Actions tab ("Run workflow").
name: Collect jobs and deploy

on:
  schedule:
    - cron: '30 3 * * *'      # every day at 03:30 UTC (06:30 Israel summer time)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect jobs from public job boards
        run: node collector/collect.js

      - name: Save the new job data in the repository
        run: |
          git config user.name "techjob-bot"
          git config user.email "techjob-bot@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%d)"
          git push || echo "nothing to push"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

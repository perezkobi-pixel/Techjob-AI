# Scans companies' careers pages to find which job-board system each one uses.
name: Probe careers pages

on:
  push:
    branches: [main]
    paths: ['tools/probe-companies.json', 'tools/probe.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/probe.js
      - name: Save the report
        run: |
          git config user.name "techjob-bot"
          git config user.email "techjob-bot@users.noreply.github.com"
          git add tools/probe-report.json
          git diff --cached --quiet || git commit -m "Probe report $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main && git push || echo "nothing to push"
